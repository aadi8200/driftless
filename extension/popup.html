<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driftless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─────────────────────────────────────────────────────────
       DESIGN TOKENS — Regain / iOS OLED Premium
    ───────────────────────────────────────────────────────── */
    :root {
      --bg:            #000000;
      --surface:       #171717;
      --surface-raised:#1C1C1E;
      --surface-inset: #0A0A0A;

      --green:         #32D74B;
      --green-dim:     rgba(50, 215, 75, 0.14);
      --green-glow:    rgba(50, 215, 75, 0.30);

      --red:           #FF453A;
      --red-dim:       rgba(255, 69, 58, 0.10);

      --text-primary:  #FFFFFF;
      --text-secondary:#8E8E93;
      --text-muted:    #3A3A3C;

      --r-card:        20px;
      --r-pill:        50px;
      --r-sm:          10px;

      --ease:          0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --spring:        0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ─────────────────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; }

    body {
      width: 320px;
      min-height: 100px;
      max-height: 600px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 20px 16px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─────────────────────────────────────────────────────────
       HEADER
    ───────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--green-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(50, 215, 75, 0.18);
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    /* ── Streak Badge (id="streakBadge" preserved) ── */
    #streakBadge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 11px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text-secondary);
      background: var(--surface);
      transition: color var(--ease), background var(--ease), box-shadow var(--ease);
      white-space: nowrap;
    }

    #streakBadge.streak-active {
      color: #FF9F0A;
      background: rgba(255, 159, 10, 0.12);
      box-shadow: 0 0 10px rgba(255, 159, 10, 0.18);
    }

    /* ─────────────────────────────────────────────────────────
       CARD
    ───────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--r-card);
      padding: 18px 18px 16px;
      margin-bottom: 10px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 1px 3px rgba(0,0,0,0.5);
      transition: box-shadow var(--ease);
      animation: fadeUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card:hover {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 2px 8px rgba(0,0,0,0.6);
    }

    .card:nth-of-type(2) { animation-delay: 0.05s; }
    .card:nth-of-type(3) { animation-delay: 0.10s; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-label {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--surface-raised);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    /* card-title and card-sub kept for JS compatibility */
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .card-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      font-weight: 400;
    }

    /* ─────────────────────────────────────────────────────────
       FOCUS STATUS BADGE (id="focusStatus" preserved exactly)
    ───────────────────────────────────────────────────────── */
    #focusStatus {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 10px 0 18px 4px;
      padding: 4px 12px 4px 10px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface);
      transition: all var(--ease);
    }

    #focusStatus::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background var(--ease), box-shadow var(--ease);
      flex-shrink: 0;
    }

    #focusStatus.active {
      color: var(--green);
      background: var(--green-dim);
    }

    #focusStatus.active::before {
      background: var(--green);
      box-shadow: 0 0 6px var(--green-glow);
    }

    /* ─────────────────────────────────────────────────────────
       IOS-STYLE TOGGLE SWITCH (toggle-switch / toggle-slider preserved)
    ───────────────────────────────────────────────────────── */
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 28px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .toggle-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #3A3A3C;
      border-radius: var(--r-pill);
      transition: background var(--ease), box-shadow var(--ease);
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 22px;
      width: 22px;
      left: 3px;
      top: 3px;
      background: #FFFFFF;
      border-radius: 50%;
      transition: transform var(--spring), box-shadow var(--ease);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    input:checked + .toggle-slider {
      background: var(--green);
      box-shadow: 0 0 14px var(--green-glow);
    }

    input:checked + .toggle-slider::before {
      transform: translateX(22px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    /* ─────────────────────────────────────────────────────────
       DAILY LIMIT SECTION
    ───────────────────────────────────────────────────────── */
    .limit-body {
      margin-top: 16px;
    }

    .limit-display {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 14px;
    }

    /* id="limitInput" preserved — transparent native-dialer style */
    #limitInput {
      width: 90px;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 40px;
      font-weight: 700;
      font-family: 'Inter', system-ui, sans-serif;
      letter-spacing: -1.5px;
      line-height: 1;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    #limitInput::-webkit-outer-spin-button,
    #limitInput::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    #limitInput::placeholder {
      color: var(--text-muted);
    }

    .limit-unit {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      padding-bottom: 4px;
    }

    /* id="saveLimitBtn" preserved — green pill */
    #saveLimitBtn {
      width: 100%;
      padding: 13px 0;
      background: var(--green);
      color: #000000;
      border: none;
      border-radius: var(--r-pill);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', system-ui, sans-serif;
      letter-spacing: -0.1px;
      transition: opacity var(--ease), transform var(--spring), box-shadow var(--ease);
      box-shadow: 0 4px 18px rgba(50, 215, 75, 0.28);
    }

    #saveLimitBtn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(50, 215, 75, 0.36);
    }

    #saveLimitBtn:active {
      transform: scale(0.97);
      opacity: 0.75;
    }

    /* id="limitSaveMsg" preserved */
    #limitSaveMsg {
      font-size: 12px;
      font-weight: 500;
      color: var(--green);
      margin-top: 10px;
      min-height: 16px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      letter-spacing: 0.2px;
    }

    /* ─────────────────────────────────────────────────────────
       SECTION LABEL (tracker-label preserved)
    ───────────────────────────────────────────────────────── */
    .tracker-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 4px 4px 10px;
    }

    /* ─────────────────────────────────────────────────────────
       TIME TRACKER (id="timer" preserved)
    ───────────────────────────────────────────────────────── */
    #timer {
      background: var(--surface);
      border-radius: var(--r-card);
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 1px 3px rgba(0,0,0,0.5);
      animation: fadeUp 0.32s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    #timer p {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
      border-bottom: 1px solid rgba(255,255,255,0.045);
      transition: background var(--ease);
    }

    #timer p:last-child {
      border-bottom: none;
    }

    #timer p:hover {
      background: rgba(255,255,255,0.024);
    }

    #timer p strong {
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    #timer p strong::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    #timer p .time-val {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--surface-raised);
      padding: 3px 10px;
      border-radius: var(--r-sm);
      letter-spacing: 0.3px;
    }

    /* ─────────────────────────────────────────────────────────
       RESET BUTTON (id="resetBtn" preserved)
    ───────────────────────────────────────────────────────── */
    #resetBtn {
      width: 100%;
      margin-top: 10px;
      padding: 13px 0;
      background: var(--red-dim);
      color: var(--red);
      border: none;
      border-radius: var(--r-pill);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', system-ui, sans-serif;
      letter-spacing: -0.1px;
      transition: opacity var(--ease), transform var(--spring), background var(--ease);
      animation: fadeUp 0.32s 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    #resetBtn:hover {
      background: rgba(255, 69, 58, 0.17);
      opacity: 0.92;
      transform: translateY(-1px);
    }

    #resetBtn:active {
      transform: scale(0.97);
    }

    /* ─────────────────────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    /* ─────────────────────────────────────────────────────────
       MICRO-ANIMATIONS
    ───────────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">🌿</div>
      <div class="header-text">
        <h1>Driftless</h1>
      </div>
    </div>
    <span id="streakBadge">— No streak yet</span>
  </div>

  <!-- ── Focus Mode Card ── -->
  <div class="card">
    <div class="card-header">
      <div class="card-label">
        <div class="card-icon-wrap">🛡️</div>
        <div>
          <div class="card-title">Focus Mode</div>
          <div class="card-sub">Block distracting sites instantly</div>
        </div>
      </div>
      <label class="toggle-switch" title="Toggle Focus Mode">
        <input type="checkbox" id="focusToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
  <div id="focusStatus">OFF</div>

  <!-- ── Daily Time Limit Card ── -->
  <div class="card">
    <div class="card-header">
      <div class="card-label">
        <div class="card-icon-wrap">⏱️</div>
        <div>
          <div class="card-title">Daily Limit</div>
          <div class="card-sub">Minutes per site before alert</div>
        </div>
      </div>
    </div>

    <div class="limit-body">
      <div class="limit-display">
        <input
          type="number"
          id="limitInput"
          min="1"
          max="1440"
          placeholder="30"
          title="Minutes before alert"
        >
        <span class="limit-unit">min</span>
      </div>
      <button id="saveLimitBtn">Save</button>
      <div id="limitSaveMsg"></div>
    </div>
  </div>

  <!-- ── Time Tracker ── -->
  <div class="tracker-label">Today's Usage</div>
  <div id="timer"></div>

  <!-- ── Reset Button ── -->
  <button id="resetBtn">↺ Reset All Timers</button>

  <!-- ── Footer ── -->
  <div class="footer">Driftless · Stay focused, stay sharp</div>

  <script src="popup.js"></script>
</body>
</html>
